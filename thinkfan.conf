# ============================================================================
#  /etc/thinkfan/thinkfan.conf: settings for thinkfan
# ============================================================================
#  This file is sourced by thinkfan (Bash syntax, no spaces around '=').
#  Order:  /etc/thinkfan/thinkfan.conf  ->  ~/.config/thinkfan/thinkfan.conf
#  (the user file overrides the system file)
#
#  IMPORTANT: The file must NOT be group/world writable, otherwise it is
#  ignored (it provides commands that partly run as root).
# ============================================================================

# --- Polling loop -----------------------------------------------------------
POLL=5                       # seconds between measurements in the guard

# --- Temperature thresholds (°C): warn / critical ---------------------------
# Role   Source in the system
#  cpu    k10temp / coretemp / x86_pkg_temp
#  gpu    amdgpu / radeon / nouveau / nvidia-smi
#  nvme   NVMe composite temperature
#  bat    battery (/sys/class/power_supply/BAT*/temp)
#  acpi   ACPI thermal zones (acpitz)
#  ec     ThinkPad EC readouts (/proc/acpi/ibm/thermal), display only
#  other  anything that cannot be mapped
WARN_CPU=80;  CRIT_CPU=92
WARN_GPU=80;  CRIT_GPU=92
WARN_NVME=70; CRIT_NVME=82
WARN_BAT=45;  CRIT_BAT=55
WARN_ACPI=70; CRIT_ACPI=85
WARN_EC=80;   CRIT_EC=92
WARN_OTHER=80; CRIT_OTHER=90

EC_IN_DECISIONS=0            # 1 = also use ThinkPad EC values for decisions
                             # (indices depend on the model, so off by default)

# --- Countermeasures: fan ---------------------------------------------------
# Fan level (ThinkPad: 0/auto, 1..7, disengaged = maximum speed)
FAN_LEVEL_WARN=5             # level set on "warn"
FAN_LEVEL_CRIT=7             # level set on "critical"
FAN_DISENGAGE_ON_CRIT=0      # 1 = use "disengaged" on critical (EC ignores control!)
FAN_RESTORE_ON_EXIT=1        # 1 = return to "auto" when the guard exits

# --- Countermeasures: CPU ---------------------------------------------------
CPU_CAP_PCT_WARN=90          # % of cpuinfo_max_freq when a warn threshold trips
CPU_CAP_PCT_CRIT=65          # % of cpuinfo_max_freq in the critical case
CPU_BOOST_CRIT=1             # 1 = disable turbo/boost in the critical case
CPU_GOVERNOR_CRIT=""         # e.g. force "powersave" (empty = change nothing)

# --- Countermeasures: processes ---------------------------------------------
RENICE_ENABLED=1             # 1 = slow down CPU hogs (nice +19)
RENICE_MIN_CPU=50            # from which CPU% a process counts as a hog
RENICE_NICE=19               # target nice value
KILL_ENABLED=0               # 1 = SIGTERM to hogs (deliberately OFF by default)
KILL_MIN_CPU=70              # from which CPU% a SIGTERM is justified
KILL_AFTER_SAMPLES=6         # only after this many measurements in the critical range

# Processes that are NEVER touched (extended regex, separated by |)
PROC_WHITELIST='^(systemd|systemd-.*|init|kthreadd|kworker.*|ksoftirqd.*|migration.*|rcu.*|Xorg|Xwayland|sshd|dbus-daemon|dbus-broker|pipewire.*|wireplumber|gnome-shell|kwin_.*|plasmashell|xfwm4|xfsettingsd|compositor|thinkfan|python3?)$'

# --- Rollback / hysteresis --------------------------------------------------
HYSTERESIS=4                 # °C below the respective threshold before rolling back
RECOVER_SAMPLES=6            # this many measurements in a row below the limit -> one level down
MIN_ESCALATE_INTERVAL=20     # minimum spacing (s) between two escalation levels

# --- Notification -----------------------------------------------------------
NOTIFY_CMD=""                # command called on escalation; receives
                             # two arguments: <level> <message>
                             # Telegram example:
                             # NOTIFY_CMD='/home/YOUR-NAME/bin/telegram-notify.sh'
NOTIFY_DESKTOP=0             # 1 = additionally notify-send when DISPLAY is set

# --- Storage ----------------------------------------------------------------
# STATE_DIR is chosen automatically:
#   root (systemd service): /var/lib/thinkfan
#   normal user:            ~/.local/state/thinkfan
# STATE_DIR=/var/lib/thinkfan
# LOG_FILE=/var/lib/thinkfan/thinkfan.log
LOG_MAX_LINES=10000          # at this line count the log is halved
